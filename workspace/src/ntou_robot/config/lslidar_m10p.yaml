x10:
  lslidar_driver_node:
    ros__parameters:
      lidar_type: "X10"
      lidar_model: "M10P"
      serial_port: "/dev/ntou_lidar"
      device_ip: "192.168.1.200"
      msop_port: 2368
      difop_port: 2369
      packet_rate: 188.0

      frame_id: "lidar_link"
      pointcloud_topic: "lslidar_point_cloud"
      laserscan_topic: "scan"
      use_time_service: false
      use_first_point_time: false
      publish_scan: true
      use_high_precision: false
      publish_multiecholaserscan: false
      enable_noise_filter: false
      N10Plus_hz: 10
      min_range: 0.15
      max_range: 50.0
      angle_disable_min: 0
      angle_disable_max: 0

      is_pretreatment: false
      x_offset: 0.0
      y_offset: 0.0
      z_offset: 0.0
      roll: 0.0
      pitch: 0.0
      yaw: 0.0
      is_MatrixTransformation: false
