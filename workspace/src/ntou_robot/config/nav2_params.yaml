amcl:
  ros__parameters:
    use_sim_time: True
    # Auto-initialize pose to match Gazebo spawn (-x 0.0 -y 0.0 -Y 1.5708)
    set_initial_pose: True
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: "base_footprint"
    global_frame_id: "map"
    odom_frame_id: "odom"
    scan_topic: /scan
    map_topic: map
    min_particles: 500
    max_particles: 2000
    pf_err: 0.05
    pf_z: 0.99
    update_min_d: 0.1
    update_min_a: 0.1
    resample_interval: 1
    transform_tolerance: 0.5
    recovery_alpha_slow: 0.001
    recovery_alpha_fast: 0.1
    z_hit: 0.8
    z_short: 0.05
    z_max: 0.05
    z_rand: 0.1
    laser_min_range: 0.15
    laser_max_range: 20.0
    laser_model_type: "likelihood_field"

bt_navigator:
  ros__parameters:
    use_sim_time: True
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odometry/filtered
    bt_loop_duration: 10
    default_server_timeout: 20
    default_nav_to_pose_bt_xml: "/root/ros2_ws/install/ntou_robot/share/ntou_robot/behavior_trees/ackermann_nav.xml"
    default_nav_through_poses_bt_xml: "/root/ros2_ws/install/ntou_robot/share/ntou_robot/behavior_trees/ackermann_nav.xml"
    navigators: ["navigate_to_pose"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"

controller_server:
  ros__parameters:
    use_sim_time: True
    enable_stamped_cmd_vel: True
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.5
    current_goal_checker: "general_goal_checker"
    current_progress_checker: "progress_checker"
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.15
      movement_time_allowance: 10.0

    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.35

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.45
      lookahead_dist: 0.6
      min_lookahead_dist: 0.35
      max_lookahead_dist: 1.0
      lookahead_time: 1.2
      rotate_to_heading_angular_vel: 0.0
      use_velocity_scaled_lookahead_dist: true
      min_approach_linear_velocity: 0.08
      approach_velocity_scaling_dist: 0.6
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 0.6 # Reduced from 1.0 so it doesn't false-trigger on hallway walls during turns
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: false # Prevents stalling near doorway inflation zones
      regulated_linear_scaling_min_radius: 0.85
      regulated_linear_scaling_min_speed: 0.12
      use_rotate_to_heading: false
      allow_reversing: true # CRITICAL: Allows RPP to follow Reeds-Shepp reverse paths & 3-point turns

planner_server:
  ros__parameters:
    use_sim_time: True
    planner_plugins: ["GridBased"]

    GridBased:
      plugin: "nav2_smac_planner::SmacPlannerHybrid"
      downsample_costmap: false
      allow_unknown: true # Allows planning if goal/corridor touches slightly unmapped gray edges
      tolerance: 0.35
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 3.0
      motion_model_for_search: "REEDS_SHEPP"
      angle_quantization_bins: 72
      minimum_turning_radius: 0.80 # Matches 0.65 rad steering lock (use 0.95 if keeping 0.5236 rad)
      reverse_penalty: 1.5 # Low enough to allow backing out of rooms/dead-ends easily
      change_penalty: 0.05
      non_straight_penalty: 1.1
      cost_penalty: 1.7
      retrospective_penalty: 0.015
      lookup_table_size: 20.0
      cache_obstacle_heuristic: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: True
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      # Exact 0.87m (L) x 0.80m (W) rectangular footprint instead of bloated circle
      footprint: "[[0.435, 0.40], [0.435, -0.40], [-0.435, -0.40], [-0.435, 0.40]]"
      resolution: 0.05
      track_unknown_space: false
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 20.0
          raytrace_min_range: 0.15
          obstacle_max_range: 15.0
          obstacle_min_range: 0.15
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5.0 # Steeper decay so doorways stay open
        inflation_radius: 0.50
      always_send_full_costmap: True

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: True
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      footprint: "[[0.435, 0.40], [0.435, -0.40], [-0.435, -0.40], [-0.435, 0.40]]"
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5.0
        inflation_radius: 0.50
      always_send_full_costmap: True

behavior_server:
  ros__parameters:
    use_sim_time: True
    enable_stamped_cmd_vel: True # Output TwistStamped natively for Ackermann controller
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["backup", "wait"]
    backup:
      plugin: "nav2_behaviors::BackUp"
    wait:
      plugin: "nav2_behaviors::Wait"
    global_frame: odom
    robot_base_frame: base_footprint
    transform_timeout: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.0
    min_rotational_vel: 0.0
    rotational_acc_lim: 0.0

map_server:
  ros__parameters:
    use_sim_time: True
    yaml_filename: ""